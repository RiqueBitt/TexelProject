name: Build TexelProject release

# Compila o TexelProject (pintura de texturas 3D do Project Club, base
# ArmorPaint) para Windows e Linux no formato da aba Apps do Project Club:
#   - Windows: TexelProject-<versão>-win.zip (TexelProject.exe + data/)
#   - Linux:   TexelProject.AppImage
# e publica a release vX.Y.Z aqui. Também tira capturas de tela reais
# (o app rodando no Linux com Vulkan por software, sob Xvfb).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex: 1.0.0)'
        required: true
        default: '1.0.0'
      publish:
        description: 'Publicar a release'
        type: boolean
        default: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make clang libvulkan-dev libgtk-3-dev libssl-dev libxi-dev libxrandr-dev libxcursor-dev libasound2-dev
      - name: Compilar
        run: cd paint && ../base/make --compile
      - name: Empacotar AppImage
        run: |
          set -e
          OUT=paint/build/out
          ls -la $OUT
          test -x $OUT/TexelProject
          APPDIR=TexelProject.AppDir
          mkdir -p $APPDIR/usr/bin
          cp -r $OUT/* $APPDIR/usr/bin/
          cp paint/icon.png $APPDIR/texelproject.png
          cat > $APPDIR/texelproject.desktop <<'D'
          [Desktop Entry]
          Type=Application
          Name=TexelProject
          GenericName=3D Texture Painting
          Comment=Pintura de texturas 3D do Project Club
          Exec=TexelProject
          Icon=texelproject
          Categories=Graphics;3DGraphics;
          Terminal=false
          D
          sed -i 's/^ *//' $APPDIR/texelproject.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\ncd "$HERE/usr/bin"\nexec "$HERE/usr/bin/TexelProject" "$@"\n' > $APPDIR/AppRun
          chmod +x $APPDIR/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p dist
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run $APPDIR dist/TexelProject.AppImage
          du -h dist/TexelProject.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: texelproject-linux
          path: dist/TexelProject.AppImage

  screenshots:
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: texelproject-linux
          path: app
      - name: Dependências para rodar e capturar
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick mesa-vulkan-drivers libvulkan1 libgtk-3-0 libasound2 libfuse2 fonts-noto-core
      - name: Rodar o TexelProject e capturar telas
        run: |
          mkdir -p shots
          bash .github/scripts/screenshots.sh app/TexelProject.AppImage shots 2>&1 | tee shots/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: texelproject-screenshots
          path: shots/
      - name: Guardar capturas no ramo 'capturas'
        if: always()
        run: |
          cd shots
          git init -q -b capturas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de tela ${{ inputs.version }} (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: pwsh
        run: |
          cd paint
          ../base/make --compile
      - name: Empacotar .zip
        shell: pwsh
        run: |
          $out = "paint\build\out"
          Get-ChildItem $out
          if (-not (Test-Path "$out\TexelProject.exe")) { throw "TexelProject.exe não foi gerado" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "dist\TexelProject-${{ inputs.version }}-win.zip"
          Get-Item dist\*.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: texelproject-windows
          path: dist/*.zip

  release:
    if: ${{ inputs.publish }}
    needs: [linux, windows, screenshots]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: TexelProject ${{ inputs.version }}
          body: |
            TexelProject ${{ inputs.version }} — pintura de texturas 3D do Project Club (baseado no ArmorPaint, licença zlib).
            - Windows: TexelProject-${{ inputs.version }}-win.zip
            - Linux: TexelProject.AppImage (precisa de Vulkan)
            Instale e atualize pela aba **Apps** do Project Club.
          files: |
            dist/texelproject-linux/TexelProject.AppImage
            dist/texelproject-windows/*.zip
            dist/texelproject-screenshots/*.png
